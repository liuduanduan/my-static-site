name: Discover verified AI tools

on:
  schedule:
    - cron: '47 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ai-catalog-writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Restore the latest trusted discovery state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .baseline
          run_id="$(gh run list --workflow discover-ai-tools.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            if ! gh run download "$run_id" --name ai-discovery-state --dir .baseline; then
              rm -f -- .baseline/ai-discovery-state.json .baseline/ai-discovery-review.md
              printf 'Previous discovery state artifact is unavailable; this run will establish a new baseline.\n'
            fi
          fi

      - name: Inspect open pull request metadata for a pending discovery batch
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --base main --state open --json number,url,headRefName,isCrossRepository --limit 1000 | node scripts/discovery/workflowPolicy.mjs pending "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Preserve actionable artifacts while a discovery batch is pending
        if: steps.pending.outputs.has_pending == 'true'
        env:
          PENDING_COUNT: ${{ steps.pending.outputs.pending_count }}
          PENDING_NUMBER: ${{ steps.pending.outputs.pending_number }}
          PENDING_URL: ${{ steps.pending.outputs.pending_url }}
          PENDING_BRANCH: ${{ steps.pending.outputs.pending_branch }}
        run: |
          set -euo pipefail
          [[ "$PENDING_COUNT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PENDING_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PENDING_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/pull/[1-9][0-9]*$ ]]
          [[ "$PENDING_BRANCH" =~ ^discovery/[A-Za-z0-9][A-Za-z0-9._/-]*[A-Za-z0-9]$ ]]
          if [[ -f .baseline/ai-discovery-state.json ]]; then
            cp -- .baseline/ai-discovery-state.json ai-discovery-state.json
          else
            printf '{"version":1,"outcomes":[]}\n' > ai-discovery-state.json
          fi
          : > discovered-urls.txt
          printf '%s\n' \
            '# AI discovery review' \
            '' \
            'A trusted discovery pull request is still open; no new batch was created.' \
            '' \
            "- Pull request: <$PENDING_URL>" \
            "- Branch: \`$PENDING_BRANCH\`" \
            "- Open discovery pull requests: $PENDING_COUNT" \
            '- Suggested action: merge or close the pending batch after resolving its checks, then rerun discovery.' \
            > ai-discovery-review.md

      - name: Discover up to the configured three-tool batch
        id: discover
        if: steps.pending.outputs.has_pending == 'false'
        env:
          CONTENT_ENRICHER_API_KEY: ${{ secrets.CONTENT_ENRICHER_API_KEY }}
          CONTENT_ENRICHER_MODEL: ${{ secrets.CONTENT_ENRICHER_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run tools:discover

      - name: Validate discovery outputs before GitHub or Git operations
        id: validate
        if: steps.pending.outputs.has_pending == 'false'
        env:
          HAS_CHANGES: ${{ steps.discover.outputs.has_changes }}
          SLUGS: ${{ steps.discover.outputs.slugs }}
          BRANCH: ${{ steps.discover.outputs.branch }}
          PR_TITLE: ${{ steps.discover.outputs.pr_title }}
          PR_BODY: ${{ steps.discover.outputs.pr_body }}
          REVIEW_PATH: ${{ steps.discover.outputs.review_path }}
          NEEDS_REVIEW: ${{ steps.discover.outputs.needs_review }}
          STATE_PATH: ${{ steps.discover.outputs.state_path }}
          CHANGED_URLS_PATH: ${{ steps.discover.outputs.changed_urls_path }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$HAS_CHANGES" != 'true' && "$HAS_CHANGES" != 'false' ]]; then
            printf 'Discovery emitted an invalid change flag.\n' >&2
            exit 1
          fi
          if [[ "$STATE_PATH" != 'ai-discovery-state.json' || "$CHANGED_URLS_PATH" != 'discovered-urls.txt' ]]; then
            printf 'Discovery emitted an invalid artifact path.\n' >&2
            exit 1
          fi
          if [[ -n "$REVIEW_PATH" && "$REVIEW_PATH" != 'ai-discovery-review.md' ]]; then
            printf 'Discovery emitted an invalid review path.\n' >&2
            exit 1
          fi
          if [[ "$NEEDS_REVIEW" != 'true' && "$NEEDS_REVIEW" != 'false' ]]; then
            printf 'Discovery emitted an invalid review flag.\n' >&2
            exit 1
          fi
          if [[ "$NEEDS_REVIEW" == 'true' && "$REVIEW_PATH" != 'ai-discovery-review.md' ]]; then
            printf 'Discovery requested review without a review artifact.\n' >&2
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            printf 'GitHub supplied an invalid run identifier.\n' >&2
            exit 1
          fi

          slug_count=0
          while IFS= read -r slug || [[ -n "$slug" ]]; do
            [[ -z "$slug" ]] && continue
            if [[ ! "$slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              printf 'Discovery emitted an invalid slug.\n' >&2
              exit 1
            fi
            slug_count=$((slug_count + 1))
          done <<< "$SLUGS"

          if [[ "$HAS_CHANGES" == 'true' ]]; then
            if [[ ! "$BRANCH" =~ ^discovery/[0-9]{4}-[0-9]{2}-[0-9]{2}$ || "$slug_count" -lt 1 || "$slug_count" -gt 3 ]]; then
              printf 'Discovery emitted an invalid batch identity.\n' >&2
              exit 1
            fi
            if [[ ! "$PR_TITLE" =~ ^收录\ [1-3]\ 个\ AI\ 工具$ || -z "$PR_BODY" ]]; then
              printf 'Discovery emitted invalid pull request metadata.\n' >&2
              exit 1
            fi
            printf 'batch_branch=%s-%s\n' "$BRANCH" "$RUN_ID" >> "$GITHUB_OUTPUT"
          elif [[ -n "$SLUGS$BRANCH$PR_TITLE$PR_BODY" ]]; then
            printf 'Discovery emitted change metadata without a change.\n' >&2
            exit 1
          fi

          touch ai-discovery-review.md
          printf 'state_path=ai-discovery-state.json\n' >> "$GITHUB_OUTPUT"
          printf 'changed_urls_path=discovered-urls.txt\n' >> "$GITHUB_OUTPUT"
          printf 'needs_review=%s\n' "$NEEDS_REVIEW" >> "$GITHUB_OUTPUT"

      - name: Decide whether an actionable review Issue is required
        id: review_decision
        if: steps.pending.outputs.has_pending == 'false'
        env:
          NEEDS_REVIEW: ${{ steps.validate.outputs.needs_review }}
        run: |
          set -euo pipefail
          node scripts/discovery/workflowPolicy.mjs review "$NEEDS_REVIEW" >> "$GITHUB_OUTPUT"

      - name: Run the complete catalog gates
        if: steps.discover.outputs.has_changes == 'true'
        run: |
          npm test
          npm run verify:build
          git diff --check

      - name: Create or reuse the verified batch pull request
        id: pull_request
        if: steps.discover.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_BRANCH: ${{ steps.validate.outputs.batch_branch }}
          PR_TITLE: ${{ steps.discover.outputs.pr_title }}
          PR_BODY: ${{ steps.discover.outputs.pr_body }}
        run: |
          set -euo pipefail
          is_catalog_path() {
            local path="$1"
            case "$path" in
              docs/.vitepress/theme/domain/ai-tools.json|docs/.vitepress/ai-pages-manifest.json) return 0 ;;
            esac
            [[ "$path" =~ ^docs/(tools|ai-categories|ai-scenarios)/[a-z0-9]+(-[a-z0-9]+)*\.md$ ]]
          }
          validate_catalog_paths() {
            local path
            local found=false
            while IFS= read -r -d '' path; do
              found=true
              if ! is_catalog_path "$path"; then
                printf 'Refusing an unexpected tracked path: %s\n' "$path" >&2
                return 1
              fi
            done
            [[ "$found" == true ]]
          }
          validate_untracked_paths() {
            local path
            while IFS= read -r -d '' path; do
              case "$path" in
                ai-discovery-state.json|ai-discovery-review.md|discovered-urls.txt) ;;
                *)
                  if ! is_catalog_path "$path"; then
                    printf 'Refusing an unexpected untracked path: %s\n' "$path" >&2
                    return 1
                  fi
                  ;;
              esac
            done
          }

          if [[ ! "$BATCH_BRANCH" =~ ^discovery/[0-9]{4}-[0-9]{2}-[0-9]{2}-[1-9][0-9]*$ ]]; then
            printf 'Refusing an invalid discovery branch.\n' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BATCH_BRANCH"
          git add -- docs/.vitepress/theme/domain/ai-tools.json docs/.vitepress/ai-pages-manifest.json docs/tools docs/ai-categories docs/ai-scenarios
          git diff --name-only HEAD -z | validate_catalog_paths
          git ls-files --others --exclude-standard -z | validate_untracked_paths
          git diff --cached --name-only -z | validate_catalog_paths
          git commit -m "$PR_TITLE"
          LOCAL_TESTED_HEAD="$(git rev-parse HEAD)"
          if [[ ! "$LOCAL_TESTED_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Git produced an invalid tested commit identifier.\n' >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$BATCH_BRANCH" > /dev/null; then
            git fetch origin "refs/heads/$BATCH_BRANCH:refs/remotes/origin/$BATCH_BRANCH"
            remote_head="$(git rev-parse "origin/$BATCH_BRANCH")"
            if [[ ! "$remote_head" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'Remote discovery branch has an invalid commit identifier.\n' >&2
              exit 1
            fi
            if ! git diff --quiet "$LOCAL_TESTED_HEAD" "$remote_head" --; then
              printf 'Remote discovery branch exists with different content; refusing to overwrite it.\n' >&2
              exit 1
            fi
            EXPECTED_HEAD="$remote_head"
          else
            git push origin "$BATCH_BRANCH"
            EXPECTED_HEAD="$LOCAL_TESTED_HEAD"
          fi
          pr_url="$(gh pr list --head "$BATCH_BRANCH" --base main --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            body_file="$(mktemp)"
            printf '%s\n' "$PR_BODY" > "$body_file"
            pr_url="$(gh pr create --base main --head "$BATCH_BRANCH" --title "$PR_TITLE" --body-file "$body_file")"
          fi
          if [[ ! "$pr_url" =~ ^https://github\.com/.+/pull/[1-9][0-9]*$ ]]; then
            printf 'GitHub returned an invalid pull request URL.\n' >&2
            exit 1
          fi
          printf 'pr_url=%s\n' "$pr_url" >> "$GITHUB_OUTPUT"
          printf 'expected_head=%s\n' "$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"

      - name: Verify pull request targets and changed paths
        if: steps.pull_request.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pull_request.outputs.pr_url }}
          BATCH_BRANCH: ${{ steps.validate.outputs.batch_branch }}
          EXPECTED_HEAD: ${{ steps.pull_request.outputs.expected_head }}
        run: |
          set -euo pipefail
          validate_changed_paths() {
            local path
            local found=false
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              found=true
              case "$path" in
                docs/.vitepress/theme/domain/ai-tools.json|docs/.vitepress/ai-pages-manifest.json|docs/tools/*.md|docs/ai-categories/*.md|docs/ai-scenarios/*.md) ;;
                *) printf 'Refusing an unexpected pull request path: %s\n' "$path" >&2; return 1 ;;
              esac
            done
            [[ "$found" == true ]]
          }

          [[ "$(gh pr view "$PR_URL" --json baseRefName --jq '.baseRefName')" == 'main' ]]
          [[ "$(gh pr view "$PR_URL" --json headRefName --jq '.headRefName')" == "$BATCH_BRANCH" ]]
          head_oid="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head_oid" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head_oid" == "$EXPECTED_HEAD" ]]
          gh pr view "$PR_URL" --json files --jq '.files[].path' | validate_changed_paths

      - name: Squash merge the verified discovery batch
        id: merge
        if: steps.pull_request.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pull_request.outputs.pr_url }}
          EXPECTED_HEAD: ${{ steps.pull_request.outputs.expected_head }}
        run: |
          set -euo pipefail
          pr_url="$PR_URL"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          gh pr merge "$pr_url" --squash --delete-branch --match-head-commit "$EXPECTED_HEAD"
          printf 'merged=true\n' >> "$GITHUB_OUTPUT"

      - name: Create or update the discovery review issue
        if: steps.review_decision.outputs.create_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --state all --search 'AI 工具自动发现审核 in:title' --json number,title --jq 'map(select(.title == "AI 工具自动发现审核")) | .[0].number // empty')"
          if [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]; then
            gh issue comment "$issue_number" --body-file ai-discovery-review.md
          else
            gh issue create --title 'AI 工具自动发现审核' --body-file ai-discovery-review.md
          fi

      - name: Preserve the discovery state and review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-discovery-state
          path: |
            ai-discovery-state.json
            ai-discovery-review.md
          if-no-files-found: warn
          retention-days: 90

      - name: Notify configured search indexes after merge
        if: steps.merge.outputs.merged == 'true'
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          CHANGED_URLS_PATH: ${{ steps.validate.outputs.changed_urls_path }}
        run: npm run search:notify -- --sitemap docs/.vitepress/dist/sitemap.xml --urls "$CHANGED_URLS_PATH"
